<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grand Line Deck</title>
    <meta
      name="description"
      content="Grand Line Deck is an unofficial offline companion for the One Piece Card Game."
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #071018;
        color: #f5f7fa;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #142536, #071018 60%);
      }

      main {
        width: min(640px, calc(100% - 40px));
        padding: 48px 0;
      }

      .eyebrow {
        color: #d4af37;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 0.78rem;
        font-weight: 700;
      }

      h1 {
        margin: 14px 0 12px;
        font-size: clamp(2.2rem, 8vw, 4.6rem);
        line-height: 0.98;
      }

      p {
        color: #b7c3cf;
        line-height: 1.7;
      }

      nav {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      a {
        color: #071018;
        background: #d4af37;
        border-radius: 999px;
        padding: 12px 18px;
        text-decoration: none;
        font-weight: 700;
      }

      a.secondary {
        color: #f5f7fa;
        background: #1b2a38;
      }

      footer {
        margin-top: 64px;
        color: #8090a0;
        font-size: 0.88rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Grand Line Deck</div>
      <h1>Build smarter. Play prepared.</h1>
      <p>
        An unofficial fan-made companion for organizing decks, tracking a
        collection, and keeping useful rules close at hand.
      </p>
      <nav aria-label="Helpful links">
        <a href="https://play.google.com/store/apps/details?id=com.grand_line_deck">
          Get the app
        </a>
        <a class="secondary" href="/privacypolicy/">Privacy policy</a>
      </nav>
      <footer>
        Not affiliated with or endorsed by Bandai, Eiichiro Oda, or official One
        Piece Card Game partners.
      </footer>
    </main>
  </body>
</html>
